services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudguard
      POSTGRES_PASSWORD: cloudguard
      POSTGRES_DB: cloudguard_lite
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudguard -d cloudguard_lite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && pnpm dev"
    environment:
      DATABASE_URL: postgresql://cloudguard:cloudguard@postgres:5432/cloudguard_lite?schema=public
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-replace-with-32-byte-base64-key}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PROWLER_VERSION: ${PROWLER_VERSION:-3.11.3}
      PROWLER_BIN: ${PROWLER_BIN:-prowler}
      PROWLER_CONCURRENCY: ${PROWLER_CONCURRENCY:-2}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && pnpm worker"
    environment:
      DATABASE_URL: postgresql://cloudguard:cloudguard@postgres:5432/cloudguard_lite?schema=public
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-replace-with-32-byte-base64-key}
      PROWLER_VERSION: ${PROWLER_VERSION:-3.11.3}
      PROWLER_BIN: ${PROWLER_BIN:-prowler}
      PROWLER_CONCURRENCY: ${PROWLER_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres-data:
